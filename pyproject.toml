[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-session-trace"
version = "0.1.4"
description = "Pytest plugin: recorded agent sessions (JSONL) as deterministic tool-call assertions. No LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "George M. Howard", email = "dev@swamplink.com" }]
keywords = ["pytest", "claude", "tool-calls", "session", "trace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.0",
    "henhouse>=0.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
anchor = ["trust-but-anchor"]

[project.urls]
Homepage = "https://github.com/gmhoward9289-ops/pytest-session-trace"

[project.entry-points.pytest11]
session_trace = "session_trace.plugin"

[project.scripts]
session-trace = "session_trace.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/session_trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
